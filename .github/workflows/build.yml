name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q visualmod.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
          build-root-directory: visualmod
      - run: gradle build
        working-directory: visualmod
      - uses: actions/upload-artifact@v4
        with:
          name: visualmod
          path: visualmod/build/libs/*.jar
