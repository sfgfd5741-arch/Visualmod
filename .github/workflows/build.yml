name: Build NOOMIDLC

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Find and extract project ZIP (if needed)
        shell: bash
        run: |
          set -euo pipefail

          # If Gradle files are already in the repository root, build there.
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          # Otherwise extract the uploaded NOOMIDLC project archive.
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Gradle files and no project ZIP found."
            echo "Upload NOOMIDLC-Fabric-1.21.4-v4.zip to the repository, or upload the extracted project files."
            exit 1
          fi

          mkdir -p _noomidlc_src
          unzip -q "$ZIP_FILE" -d _noomidlc_src

          GRADLE_FILE="$(find _noomidlc_src -type f \\( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \\) | head -n 1 || true)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: ZIP does not contain Gradle project files."
            exit 1
          fi

          BUILD_DIR="$(dirname "$GRADLE_FILE")"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $BUILD_DIR"

      - name: Build mod
        run: gradle -p "$BUILD_DIR" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NOOMIDLC-Minecraft-1.21.4
          path: |
            _noomidlc_src/**/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
