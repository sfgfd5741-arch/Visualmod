name: UltraBoost MEGA Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build UltraBoost
        run: gradle build

      - name: Upload UltraBoost JAR
        uses: actions/upload-artifact@v4
        with:
          name: UltraBoost-MEGA-1.21.4
          path: build/libs/*.jar
