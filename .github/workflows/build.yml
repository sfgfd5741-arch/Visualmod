name: Build NOOMIDLC

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          # First check whether the project is already extracted in the repository.
          if [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ] || [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
            echo "BUILD_DIR=." >> "$GITHUB_ENV"
          else
            # Otherwise find and extract the uploaded ZIP.
            ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle project or ZIP archive found."
              exit 1
            fi

            mkdir -p _noomidlc_src
            unzip -q "$ZIP_FILE" -d _noomidlc_src

            BUILD_FILE="$(find _noomidlc_src -type f -name 'build.gradle' | head -n 1)"
            if [ -z "$BUILD_FILE" ]; then
              BUILD_FILE="$(find _noomidlc_src -type f -name 'build.gradle.kts' | head -n 1)"
            fi
            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: ZIP archive does not contain build.gradle or build.gradle.kts."
              exit 1
            fi

            BUILD_DIR="$(dirname "$BUILD_FILE")"
            echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build mod
        run: gradle -p "$BUILD_DIR" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NOOMIDLC-Minecraft-1.21.4
          path: |
            _noomidlc_src/**/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
